name: Checks

# What CLAUDE.md's "Before you finish any change" asks for, run on every pull request: Biome (formatting and
# lint), the typecheck and Vite build, the color-contrast check, and the Go build and tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json # the version in its packageManager field

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Biome (format + lint)
        run: pnpm exec biome ci --reporter=github

      - name: Typecheck and build
        run: pnpm run build

      - name: Color contrast
        run: pnpm run contrast

      - name: Pure-logic checks
        run: for f in $(find src -name '*.check.ts'); do pnpm dlx tsx "$f"; done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so there's no go.sum to key a module cache on

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
