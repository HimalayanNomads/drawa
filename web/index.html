<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawa</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>/* theme before first paint, no flash of the wrong one (lib/theme.ts owns it after boot; same defaults) */
  (function(){try{for(var i=localStorage.length;i--;){var k=localStorage.key(i)  /* keys saved before the rename to Drawa */
    if(k.indexOf('claude-ui:')===0){var n='drawa:'+k.slice(10);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}}catch(e){}
  var c={};try{c=JSON.parse(localStorage.getItem('drawa:theme')||'{}')||{}}catch(e){}
  var m=c.mode||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),r=document.documentElement
  r.dataset.theme=m;r.dataset.scheme=c[m]||(m==='dark'?'claude-dark':'claude-light')})()</script>
<link rel="stylesheet" href="/src/styles/index.css"><!-- linked, not imported from JS: no unstyled flash while scripts load -->

<div id="stage" aria-label="Canvas: drag to pan, Ctrl+scroll to zoom">
  <div id="world">
    <svg id="edges" width="1" height="1" aria-hidden="true">
      <defs>
        <marker id="m-read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
        <marker id="m-edit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
        <marker id="m-write" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
        <marker id="m-plan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
        <marker id="m-ref" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
        <marker id="m-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9z"/></marker>
      </defs>
    </svg>
  </div>
  <div id="inkworld"><svg id="ink" width="1" height="1" aria-hidden="true"></svg></div>
  <div id="ink-capture" hidden aria-label="Drawing surface"></div>
</div>

<header id="bar" class="float">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div class="brand-text">
      <b id="pname">Drawa</b>
      <span id="ppath"></span>
    </div>
  </div>
  <span class="sep"></span>
  <button id="btn-new" class="btn primary" title="New session (N)" aria-label="New session"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span class="lbl">New session</span></button>
  <button id="btn-find" class="btn" title="Find a window (Ctrl+K)" aria-label="Find a window"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></button>
  <div id="modes" class="seg" role="group" aria-label="Canvas mode">
    <button id="mode-select" type="button" title="Select: drag on empty canvas to select (V or 1)" aria-label="Select"><svg viewBox="0 0 16 16"><path d="M3.5 2.5l9 5.2-3.9.9 2.3 3.9-1.6.9-2.3-3.9-3 2.6z"/></svg></button>
    <button id="mode-hand" type="button" title="Hand: drag to pan (H, or hold Space)" aria-label="Hand"><svg viewBox="0 0 16 16"><path d="M5.5 8V3.8a1 1 0 0 1 2 0V7.5M7.5 7V2.8a1 1 0 0 1 2 0V7.5M9.5 7.2V3.8a1 1 0 0 1 2 0v5.4c0 2.8-1.8 4.3-4 4.3-1.8 0-2.7-.8-3.6-2.2L2.6 8.6a1 1 0 0 1 1.6-1.2l1.3 1.6"/></svg></button>
  </div>
  <button id="btn-draw" class="btn" title="Draw on the canvas (D)" aria-pressed="false" aria-label="Draw"><svg viewBox="0 0 16 16"><path d="M2.5 13.5c2-1 3-4.5 5.5-4.5s2 3 4 3 1.5-2.5 1.5-2.5"/></svg><span class="lbl">Draw</span></button>
  <button id="btn-scratch" class="btn" title="New scratchpad: Markdown with code, diagrams and callouts (S)" aria-label="Scratchpad"><svg viewBox="0 0 16 16"><path d="M3.5 2.5h7l2 2v9h-9zM5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg><span class="lbl">Scratchpad</span></button>
  <button id="btn-git" class="btn" title="Git: changes, commit, push (G)" aria-label="Git"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="6" r="1.5"/><path d="M4.5 5v6M11.5 7.5c0 2.5-3 2.5-7 3.5"/></svg><span class="lbl">Git</span></button>
  <button id="btn-drawer" class="btn" title="History and files (Shift+H)" aria-expanded="false" aria-label="History and files"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg><span class="lbl">History &amp; files</span></button>
  <button id="btn-theme" class="btn icon-btn"></button>
  <button id="btn-fonts" class="btn" title="Appearance: color schemes and fonts" aria-expanded="false" aria-controls="fontpanel"><span class="aa">Aa</span></button>
</header>

<div id="fontpanel" class="float" hidden role="dialog" aria-label="Appearance">
  <label for="scheme-light">Light scheme</label>
  <select id="scheme-light"></select>
  <label for="scheme-dark">Dark scheme</label>
  <select id="scheme-dark"></select>
  <hr>
  <label for="font-ui">Interface font</label>
  <select id="font-ui"></select>
  <input id="font-ui-custom" placeholder="Installed font name, e.g. IBM Plex Sans" hidden>
  <label for="font-code">Code font</label>
  <select id="font-code"></select>
  <input id="font-code-custom" placeholder="Installed font name, e.g. Fira Code" hidden>
  <p class="preview">The quick brown fox <code>const x = 42</code></p>
</div>

<div id="inkbar" class="float" hidden role="toolbar" aria-label="Drawing tools">
  <button data-ink="color:ink" class="sw on" style="--c:var(--ink)" aria-label="Ink color"></button>
  <button data-ink="color:edit" class="sw" style="--c:var(--edit)" aria-label="Teal"></button>
  <button data-ink="color:write" class="sw" style="--c:var(--write)" aria-label="Violet"></button>
  <button data-ink="color:run" class="sw" style="--c:var(--run)" aria-label="Amber"></button>
  <button data-ink="color:danger" class="sw" style="--c:var(--danger)" aria-label="Red"></button>
  <span class="sep"></span>
  <button data-ink="size:2" class="sz" aria-label="Thin pen"><i style="--d:3px"></i></button>
  <button data-ink="size:4" class="sz on" aria-label="Medium pen"><i style="--d:6px"></i></button>
  <button data-ink="size:9" class="sz" aria-label="Thick pen"><i style="--d:10px"></i></button>
  <span class="sep"></span>
  <button data-ink="rect" class="icon" title="Rectangle: drag to draw, Shift for a square (R or 2)" aria-label="Rectangle"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11z"/></svg></button>
  <button data-ink="diamond" class="icon" title="Diamond: drag to draw (3)" aria-label="Diamond"><svg viewBox="0 0 16 16"><path d="M8 2 14 8 8 14 2 8z"/></svg></button>
  <button data-ink="ellipse" class="icon" title="Ellipse: drag to draw, Shift for a circle (O or 4)" aria-label="Ellipse"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="4.8"/></svg></button>
  <button data-ink="line" class="icon" title="Line: drag to draw, Shift snaps to 45° (L or 6)" aria-label="Line"><svg viewBox="0 0 16 16"><path d="M3 13 13 3"/></svg></button>
  <button data-ink="fill" class="icon" title="Fill new shapes" aria-label="Fill new shapes" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11z" fill="currentColor" fill-opacity=".3"/></svg></button>
  <span class="sep"></span>
  <button data-ink="text" class="icon" title="Text: click anywhere and type; click your text to change it (T)" aria-label="Text"><svg viewBox="0 0 16 16"><path d="M3 3.5h10M8 3.5v10M6 13.5h4"/></svg></button>
  <button data-ink="arrow" class="icon" title="Arrow between two items: press on one, release on another (A)" aria-label="Arrow between items"><svg viewBox="0 0 16 16"><path d="M2.5 13.5 13 3M7.5 3H13v5.5"/></svg></button>
  <button data-ink="erase" class="icon" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 16 16"><path d="M6 13.5h7.5M9.5 2.8l3.7 3.7-6.9 6.9H3.4L2 12l7.5-9.2zM6.2 6.3l3.7 3.7"/></svg></button>
  <button data-ink="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5.5 4 2.5 7l3 3M2.5 7h7a4 4 0 0 1 0 8h-2"/></svg></button>
  <button data-ink="clear" class="btn" title="Erase everything">Clear</button>
  <button data-ink="done" class="btn primary" title="Stop drawing (D or Esc)">Done</button>
</div>

<aside id="drawer" class="panel" hidden aria-label="History and files">
  <div class="bar tabs">
    <div class="seg"><button data-l="sessions" class="on">History</button><button data-l="tree">Files</button></div>
    <button id="refresh" class="icon" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
    <button id="dclose" class="icon" title="Close (Esc or H)" aria-label="Close history and files"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="sessions" class="pane"></div>
  <ul id="tree" class="pane" hidden></ul>
</aside>

<aside id="inspector" class="panel" hidden aria-label="File inspector">
  <div class="bar">
    <span id="ipath" class="path"></span>
    <button id="iclose" class="icon" aria-label="Close inspector" title="Close (Esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="bar tabs"><div class="seg"><button data-r="changes" class="on">Changes <span id="nchg" class="count"></span></button><button data-r="viewer">File</button></div><button id="foldall" class="btn" title="Collapse or expand every diff">Collapse all</button></div>
  <div id="changes" class="pane"></div>
  <div id="viewer" class="pane" hidden></div>
</aside>

<div id="nav" class="float">
  <div id="minimap" title="Click to jump"><div id="mm"></div></div>
  <div class="zoom">
    <button id="z-out" class="icon" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <button id="z-label" class="zl" title="Reset to 100% (0)">100%</button>
    <button id="z-in" class="icon" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="z-fit" class="btn" title="Fit everything (F)">Fit</button>
  </div>
</div>
<p id="conn" class="float" hidden role="status" aria-live="polite"><i></i><span></span></p>
<p id="hint" class="float"><kbd>V</kbd> select &middot; <kbd>H</kbd> or <kbd>Space</kbd>+drag to pan &middot; <kbd>Ctrl</kbd>+scroll to zoom &middot; <kbd>N</kbd> new session &middot; <kbd>C</kbd> next session &middot; double-click for text &middot; <kbd>D</kbd> draw &middot; <kbd>S</kbd> scratchpad &middot; <kbd>F</kbd> fit</p>

<dialog id="zoom" aria-label="Zoom">
  <div class="bar">
    <span>Scroll to zoom, drag to pan, Esc to close</span>
    <button class="icon" data-z="out" aria-label="Zoom out" title="Zoom out (-)"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <button class="icon" data-z="in" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button class="btn" data-z="fit" title="Fit (0)">Fit</button>
    <button class="icon" data-z="close" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="stage"><div class="content"></div></div>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-t">
  <form method="dialog">
    <h2 id="confirm-t"></h2>
    <p></p>
    <div class="row"><button value="" class="btn" autofocus>Cancel</button><button value="ok" class="btn danger"></button></div>
  </form>
</dialog>
<dialog id="sketcher" aria-label="Whiteboard editor">
  <div class="bar">
    <input aria-label="Whiteboard name" placeholder="Whiteboard name">
    <span class="status" aria-live="polite"></span>
    <button class="btn cancel" title="Discard this editing session (a new, never-finished whiteboard is removed)">Cancel</button>
    <button class="btn primary done">Done</button>
  </div>
  <div class="host"></div>
</dialog>
<script type="module" src="/src/main.ts"></script>
</html>
